{% extends "base.html" %}
{% block body_class %}page-auth{% endblock %}

<div class="auth-wrap">

    <img src="{{ url_for('static', filename='img/listings/' ~ (auth_image or 'valley-view-suite') ~ '-1600.jpg') }}" alt="" width="1600" height="1067">

</div>
{% endblock %}
