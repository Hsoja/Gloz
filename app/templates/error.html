{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="shell error-page">
  <p class="error-code" aria-hidden="true">{{ code }}</p>
  <h1 class="title-lg">{{ title }}</h1>
  <p class="lede">{{ hint }}</p>
  <div class="error-actions">
    <a class="btn btn-primary" href="{{ url_for('main.index') }}">Go to the home page</a>
    <a class="btn btn-outline" href="{{ url_for('main.listings') }}">Browse homes</a>
  </div>
  {% if g.request_id %}<p class="fine-print">Reference: {{ g.request_id }}</p>{% endif %}
</div>
{% endblock %}
