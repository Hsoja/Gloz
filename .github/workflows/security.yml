name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: pip-audit -r requirements.lock
      - run: bandit -q -r app wsgi.py run.py --severity-level medium
      - run: bash scripts/scan_exposed_files.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0
          git /repo --log-opts=--all --redact=100 --no-banner

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.140.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: semgrep scan --config p/python --config p/flask --config p/secrets --error --metrics=off app wsgi.py run.py
